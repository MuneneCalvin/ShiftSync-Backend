name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" | tr -d '\r' > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Verify key
        run: |
          head -1 ~/.ssh/ec2_key
          tail -1 ~/.ssh/ec2_key
          wc -l ~/.ssh/ec2_key

      - name: Deploy to EC2
        run: |
          ssh -vvv -i ~/.ssh/ec2_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} '
            cd ~/shiftsync-backend
            git pull origin main
            sudo docker compose build
            sudo docker compose run --rm app npx prisma migrate deploy
            sudo docker compose up -d
          '
